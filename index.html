<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    body {
        margin: 0;
        height: 100vh;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    button {
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
    }

    div {
        position: fixed;
        top: 0;
        left: 0;
        width: 1000px;
        height: 1000px;
        backdrop-filter: blur(1px);
        -webkit-backdrop-filter: blur(10px);
        pointer-events: none;
        display: none;
    }
</style>
</head>

<body>

<button>Continue to site</button>

<div><div></div></div>

<script>
const button = document.querySelector("button");
const blurDivs = document.querySelectorAll("div");

    function showOverlayAndHideButton() {
    // Hide button
    button.style.display = "none";

    // Show background image
    document.body.style.background =
        "url('https://raw.githubusercontent.com/111222-dev/fiwacrashsystem/refs/heads/master/img/wawwwa%20(1).png') no-repeat center center";
    document.body.style.backgroundSize = "cover";

    function enterFullscreen() {
    document.documentElement.requestFullscreen().catch(function (err) {
    console.error(err);
        });
    }

    function checkFullscreen() {
    if (!document.fullscreenElement) {
                    enterFullscreen();
        }
    }

    enterFullscreen();
    window.onresize = function(event){
    checkFullscreen()
    }
}
    
button.addEventListener("click", () => {

    showOverlayAndHideButton();

    // After 2 seconds, activate all blur divs
    setTimeout(() => {
        blurDivs.forEach(div => {
            div.style.display = "block";
        });
    }, 2000);

});
</script>

</body>
</html>
